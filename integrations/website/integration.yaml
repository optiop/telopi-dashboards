# Website: browser telemetry (Faro) from each visitor's browser. An owner or
# admin adds the customer's sites on the portal's Website page, which shows the
# snippet for their pages; no Alloy, so install is telopi (no snippet here).
id: website
name: Website
category: website
description: Page loads, Core Web Vitals, JavaScript errors and sessions, from your visitors' browsers.
signals: [logs]
check:
  datasource: loki
  query: sum(count_over_time({source="faro"}[1h]))
install: telopi
dashboards:
  - uid: gaas-website
    title: Website
alerts: alerts/website/loki.yaml
