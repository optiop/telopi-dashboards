# Every dashboard follows the rules in the README and Grafana imports it, and
# every alert rule set follows them and promtool or Loki's ruler takes it.
# main is what every customer's Grafana reads, so nothing reaches it unchecked.
name: Check dashboards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # The version customers' Grafanas run. Move it with theirs.
      grafana:
        image: grafana/grafana:13.2.1
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: PyYAML, which reads the alert rules
        run: pip install pyyaml==6.0.3
      - name: The check's own tests
        run: python3 scripts/check_test.py && python3 scripts/check_alerts_test.py
      - name: The rules, and no uid changed
        run: python3 scripts/check.py --base "origin/${{ github.base_ref || 'main' }}"
      - name: Grafana imports each dashboard
        run: python3 scripts/check.py --grafana http://localhost:3000
      - name: Each alert rule set, through promtool and Loki's ruler
        run: |
          docker run -d --name loki-check -p 127.0.0.1:3100:3100 -v "$PWD/scripts/loki-check.yaml:/etc/loki/check.yaml:ro" grafana/loki:3.7.7 -config.file=/etc/loki/check.yaml
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/ready && break; sleep 2; done
          python3 scripts/check_alerts.py --loki http://127.0.0.1:3100 --promtool "docker run --rm -v {dir}:/rules --entrypoint promtool prom/prometheus:v3.5.0"
