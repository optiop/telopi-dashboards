# A Loki whose ruler API takes rules, as the platform's does (its chart's
# loki-config): check_alerts.py --loki posts each Loki set to it, so a rule
# Loki would refuse never reaches main. Single process, all in /tmp.
auth_enabled: true
server:
  http_listen_port: 3100
common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
storage_config:
  use_thanos_objstore: true
  object_store:
    filesystem:
      dir: /tmp/loki/chunks
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/loki/ruler
ruler:
  enable_api: true
