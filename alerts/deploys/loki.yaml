# Deploys: a deploy that failed. Loki evaluates it every minute over the
# deploy events Telopi writes from the customer's deploy sources (GitHub,
# GitLab, Argo CD; Telopi's ADR-0060), one line each, whose status is failure.
# Argo CD's degraded is collected but does not alert: it is a health, not a
# failed deploy.
thresholds: {}
groups:
  - name: deploys
    interval: 1m
    rules:
      - alert: DeployFailed
        expr: |
          sum by (provider, service, environment) (count_over_time({service_name="telopi-deploys"} | json status | status="failure" [10m])) > 0
        # No for: a failure is one event, not a state that persists; the count
        # stays above 0 for the 10 minutes after it, then the alert resolves.
        labels:
          severity: warning
        annotations:
          summary: "A deploy of {{ $labels.service }} to {{ if $labels.environment }}{{ $labels.environment }}{{ else }}an unknown environment{{ end }} failed"
          description: "{{ $value }} failed deploys of {{ $labels.service }} to {{ if $labels.environment }}{{ $labels.environment }}{{ else }}an unknown environment{{ end }} on {{ $labels.provider }} in the last 10 minutes."
